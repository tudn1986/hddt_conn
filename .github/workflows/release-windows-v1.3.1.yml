name: Build Windows v1.3.1

on:
  push:
    branches:
      - release/v1.3.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify
        shell: pwsh
        run: pnpm verify

      - name: Build Windows portable
        shell: pwsh
        run: pnpm package:win-x64

      - name: Validate artifact
        shell: pwsh
        run: |
          $zip = 'release/hddt_conn_v1.3.1_windows_x64.zip'
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries.FullName
            if (-not ($names -match '/HDDT_CONN.exe$')) { throw 'HDDT_CONN.exe missing from release ZIP.' }
            if (-not ($names -match '/hddt_conn.ico$')) { throw 'hddt_conn.ico missing from release ZIP.' }
            if (-not ($names -match '/hddt-server.exe$')) { throw 'hddt-server.exe missing from release ZIP.' }
          } finally {
            $archive.Dispose()
          }
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hddt_conn_v1.3.1_windows_x64
          path: release/hddt_conn_v1.3.1_windows_x64.zip
          if-no-files-found: error

      - name: Commit Windows artifact to release branch
        if: github.ref == 'refs/heads/release/v1.3.1'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release/hddt_conn_v1.3.1_windows_x64.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'release: add Windows v1.3.1 artifact [skip ci]'
            git push origin HEAD:release/v1.3.1
          }
