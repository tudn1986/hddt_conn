name: hddt-public

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: hddt_conn:${HDDT_IMAGE_TAG:-1.3.0-public}
    restart: unless-stopped
    init: true

    ports:
      - "8188:3210"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh

      HDDT_DOCKER: "1"
      HDDT_CONNECTOR: live

      HDDT_BIND_HOST: 0.0.0.0
      HDDT_PORT: "3210"
      HDDT_FIXED_PORT: "1"
      HDDT_NO_OPEN_BROWSER: "1"

      HDDT_APP_DATA_DIR: /data/app
      HDDT_DATA_ROOT: /tmp/disabled-business-data

      HDDT_PUBLIC_URL: https://inv.dangkhoi.net
      HDDT_ALLOWED_ORIGINS: https://inv.dangkhoi.net

      HDDT_TRUST_PROXY_CIDRS: ${HDDT_TRUST_PROXY_CIDRS:-172.16.0.0/12}

      HDDT_ADMIN_TOKEN: ${HDDT_ADMIN_TOKEN:?set a random 32+ character admin token}

      HDDT_SESSION_IDLE_MS: ${HDDT_SESSION_IDLE_MS:-1800000}
      HDDT_SESSION_ABSOLUTE_MS: ${HDDT_SESSION_ABSOLUTE_MS:-28800000}
      HDDT_MAX_SESSIONS: ${HDDT_MAX_SESSIONS:-500}
      HDDT_RATE_LIMIT_PER_MINUTE: ${HDDT_RATE_LIMIT_PER_MINUTE:-300}
      HDDT_TVAN_BATCH_MAX_BYTES: ${HDDT_TVAN_BATCH_MAX_BYTES:-268435456}

    volumes:
      - hddt_metadata:/data/app

    tmpfs:
      - /tmp:size=512m,mode=1770,uid=1000,gid=1000

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: ${HDDT_MEMORY_LIMIT:-1g}
    cpus: ${HDDT_CPU_LIMIT:-2.0}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3210/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: false

volumes:
  hddt_metadata:
